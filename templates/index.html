<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="title">CRUD</h1>
        
        <!-- Add Form -->
        <div class="card">
            <h2 class="form-title">Add New Person</h2>
            <form method="POST" action="{{ url_for('add') }}" class="form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Enter name">
                </div>
                
                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" required placeholder="Enter age" min="1" max="150">
                </div>
                
                <button type="submit" class="btn btn-add">Add</button>
            </form>
        </div>
        
        <!-- Records Table -->
        <div class="card">
            <h2 class="table-title">Records</h2>
            {% if people %}
                <table class="records-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for person in people %}
                            <tr>
                                <td>{{ person.id }}</td>
                                <td>{{ person.name }}</td>
                                <td>{{ person.age }}</td>
                                <td class="actions">
                                    <a href="{{ url_for('edit', id=person.id) }}" class="btn btn-small btn-edit">Edit</a>
                                    <a href="{{ url_for('delete', id=person.id) }}" class="btn btn-small btn-delete" onclick="return confirm('Are you sure?')">Delete</a>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <div class="empty-message">
                    <p>No records found. Add a new person to get started!</p>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
